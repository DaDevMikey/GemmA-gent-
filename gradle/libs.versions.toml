[versions]
androidGradlePlugin = "9.4.1"
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.03.01"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
coroutines = "1.10.2"
genaiPrompt = "1.0.0-beta5"
healthConnect = "1.1.0-rc01"
junit = "4.13.2"
kotlin = "2.3.20"
nav3Core = "1.0.1"
lifecycleViewmodelNav3 = "2.10.0"

[libraries]
oneui-icons = { module = "io.github.oneuiproject:icons", version = "1.1.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3"}
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
google-mlkit-genai-prompt = { module = "com.google.mlkit:genai-prompt", version.ref = "genaiPrompt" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui"}
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"}
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4"}
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"}
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest"}
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }


# Matched SESL9 revisions from Twidget. Only requested modules are packaged.
sesl-appcompat = { module = "sesl.androidx.appcompat:appcompat", version = { strictly = "1.8.0+1.0.38-sesl9+rev7" } }
sesl-coordinatorlayout = { module = "sesl.androidx.coordinatorlayout:coordinatorlayout", version = { strictly = "1.3.0+1.0.6-sesl9+rev0" } }
sesl-core = { module = "sesl.androidx.core:core", version = { strictly = "1.19.0+1.0.29-sesl9+rev6" } }
sesl-customview = { module = "sesl.androidx.customview:customview", version = { strictly = "1.2.0-rc01+1.0.1-sesl9+rev0" } }
sesl-drawerlayout = { module = "sesl.androidx.drawerlayout:drawerlayout", version = { strictly = "1.2.0+1.0.5-sesl9+rev1" } }
sesl-fragment = { module = "sesl.androidx.fragment:fragment", version = { strictly = "1.9.0+1.0.6-sesl9+rev1" } }
sesl-indexscroll = { module = "sesl.androidx.indexscroll:indexscroll", version = { strictly = "1.0.2+1.0.2-sesl9+rev0" } }
sesl-material = { module = "sesl.com.google.android.material:material", version = { strictly = "1.14.0+1.0.47-sesl9+rev13" } }
sesl-picker-app = { module = "sesl.androidx.picker:picker-app", version = { strictly = "1.0.17+1.0.17-sesl9+rev0" } }
sesl-picker-basic = { module = "sesl.androidx.picker:picker-basic", version = { strictly = "1.0.8+1.0.8-sesl9+rev0" } }
sesl-picker-color = { module = "sesl.androidx.picker:picker-color", version = { strictly = "1.0.8+1.0.8-sesl9+rev0" } }
sesl-preference = { module = "sesl.androidx.preference:preference", version = { strictly = "1.2.1+1.0.5-sesl9+rev0" } }
sesl-recyclerview = { module = "sesl.androidx.recyclerview:recyclerview", version = { strictly = "1.4.0+1.0.25-sesl9+rev6" } }
sesl-slidingpanelayout = { module = "sesl.androidx.slidingpanelayout:slidingpanelayout", version = { strictly = "1.2.0+1.0.2-sesl9+rev0" } }
sesl-swiperefreshlayout = { module = "sesl.androidx.swiperefreshlayout:swiperefreshlayout", version = { strictly = "1.2.0-alpha01+1.0.2-sesl9+rev0" } }
sesl-viewpager = { module = "sesl.androidx.viewpager:viewpager", version = { strictly = "1.1.0-beta01+1.0.1-sesl9+rev0" } }
sesl-viewpager2 = { module = "sesl.androidx.viewpager2:viewpager2", version = { strictly = "1.1.0+1.0.5-sesl9+rev1" } }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }