name: Build & Attach APK on Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Upload APK to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "GemmA-${TAG_NAME}-debug.apk"
          gh release upload "${TAG_NAME}" "GemmA-${TAG_NAME}-debug.apk" --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GemmA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
